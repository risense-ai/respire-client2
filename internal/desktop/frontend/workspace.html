<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>Respire</title>
    <link rel="stylesheet" href="fonts.css" />
    <link rel="stylesheet" href="dashboard.css" />
    <link rel="stylesheet" href="onboarding/onboarding.css" />
    <link rel="stylesheet" href="memory/workspace.css" />
    <script type="module" src="/wails/runtime.js"></script>
    <script type="module" src="client.js"></script>
  </head>
  <body>
    <a class="skip-link" href="#view">Skip to content</a>
    <aside class="sidebar">
      <div class="brand">
        <img id="brand-icon" src="brand/respire-light.svg" alt="" /><span
          >respire<span class="brand-period">.</span></span
        >
      </div>
      <button type="button" class="workspace-label" id="workspace-entry" title="打开账户与空间">
        <span class="dot" id="connection-dot"></span>
        <span class="workspace-copy"
          ><strong>Local workspace</strong>
          ><small id="connection-label">Connecting to Runtime</small></span
        >
      </button>
      <nav aria-label="Main navigation">
        <button data-page="overview"
          ><svg class="nav-ic" viewBox="0 0 20 20" width="16" height="16" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="3.5" width="5.5" height="5.5" rx="1"/><rect x="11" y="3.5" width="5.5" height="5.5" rx="1"/><rect x="3.5" y="11" width="5.5" height="5.5" rx="1"/><rect x="11" y="11" width="5.5" height="5.5" rx="1"/></g></svg><span>概览</span></button>
        <button data-page="memories"
          ><svg class="nav-ic" viewBox="0 0 20 20" width="16" height="16" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="10" cy="5" rx="6" ry="2.5"/><path d="M4 5v10c0 1.4 2.7 2.5 6 2.5s6-1.1 6-2.5V5"/><path d="M4 10c0 1.4 2.7 2.5 6 2.5s6-1.1 6-2.5"/></g></svg><span>记忆</span><span id="nav-memory-count"></span></button>
        <button data-page="diary"
          ><svg class="nav-ic" viewBox="0 0 20 20" width="16" height="16" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="4.5" width="13" height="12" rx="1.5"/><path d="M3.5 8.5h13M7 3v3M13 3v3"/></g></svg><span>日记</span><span id="nav-diary-count"></span></button>
        <button data-page="stats"
          ><svg class="nav-ic" viewBox="0 0 20 20" width="16" height="16" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 16.5h13"/><path d="M6 16.5V10.5M10 16.5V6.5M14 16.5V8.5"/></g></svg><span>统计</span><span id="nav-stats-count"></span></button>
        <button data-page="organize"
          ><svg class="nav-ic" viewBox="0 0 20 20" width="16" height="16" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="10" cy="4" r="1.6"/><circle cx="4.5" cy="15" r="1.6"/><circle cx="15.5" cy="15" r="1.6"/><path d="M10 5.6v3.2c0 2.2-4.4 2.6-4.9 4.6M10 8.8c0 2.2 4.4 2.6 4.9 4.6"/></g></svg><span>整理</span><span id="nav-organize-count"></span></button>
        <button data-page="session-import"
          ><svg class="nav-ic" viewBox="0 0 20 20" width="16" height="16" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 12.5v3a1 1 0 0 0 1 1h11a1 1 0 0 0 1-1v-3M10 2.5v9M6.5 8 10 11.5 13.5 8"/></g></svg><span>会话导入</span></button>
        <button data-page="models"
          ><svg class="nav-ic" viewBox="0 0 20 20" width="16" height="16" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="5.5" y="5.5" width="9" height="9" rx="1.5"/><path d="M8 2.5v3M12 2.5v3M8 14.5v3M12 14.5v3M2.5 8h3M2.5 12h3M14.5 8h3M14.5 12h3"/></g></svg><span>模型与索引</span></button>
        <button data-page="accounts"
          ><svg class="nav-ic" viewBox="0 0 20 20" width="16" height="16" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="10" cy="6.5" r="3"/><path d="M4 17c.8-3.2 3.1-5 6-5s5.2 1.8 6 5"/></g></svg><span>账户与空间</span></button>
        <button data-page="injection"
          ><svg class="nav-ic" viewBox="0 0 20 20" width="16" height="16" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M10 3v8M7 8.5 10 11.5l3-3M4 14.5h12"/></g></svg><span>配置Agent</span></button>
        <button data-page="grants"
          ><svg class="nav-ic" viewBox="0 0 20 20" width="16" height="16" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M10 2.5 16 5v5c0 4-2.7 6.4-6 7.5C6.7 16.4 4 14 4 10V5z"/><path d="M7.5 9.5 9.5 11.5 13 8"/></g></svg><span>访问授权</span></button>
      </nav>
      <nav class="nav-bottom" aria-label="Management">
        <button data-page="settings"
          ><svg class="nav-ic" viewBox="0 0 20 20" width="16" height="16" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 6h13M3.5 14h13"/><circle cx="8" cy="6" r="2"/><circle cx="12.5" cy="14" r="2"/></g></svg><span>设置</span></button>
        <button data-page="updates"
          ><svg class="nav-ic" viewBox="0 0 20 20" width="16" height="16" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M15.5 10a5.5 5.5 0 1 1-1.6-3.9"/><path d="M15.7 3.5v3h-3"/></g></svg><span>更新</span></button>
        <button data-page="operations"
          ><svg class="nav-ic" viewBox="0 0 20 20" width="16" height="16" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="10" cy="10" r="6.5"/><path d="M10 6.5V10l2.5 1.5"/></g></svg><span>操作记录</span></button>
        <button data-page="diagnostics"
          ><svg class="nav-ic" viewBox="0 0 20 20" width="16" height="16" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 10h3.5l2-4.5 3 9 2-4.5h4.5"/></g></svg><span>诊断</span></button>
      </nav>
      <div class="sidebar-foot">
        <span id="client-version"></span><small id="client-platform"></small>
      </div>
      <div id="sidebar-resizer" aria-hidden="true"></div>
    </aside>
    <main>
      <header class="topbar">
        <div class="breadcrumbs">
          Workspace<span>/</span><strong id="breadcrumb">Overview</strong>
        </div>
        <div class="top-actions">
          <div class="dropdown" id="language-dropdown">
            <button type="button" class="dropdown-toggle" aria-haspopup="listbox" aria-expanded="false" aria-label="Language"><span class="dropdown-value">中文</span><svg class="chevron" width="10" height="10" viewBox="0 0 10 10" aria-hidden="true"><path d="M1 3l4 4 4-4" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
            <ul class="dropdown-menu" role="listbox" hidden>
              <li role="option" tabindex="-1" data-value="en" aria-selected="false">English</li>
              <li role="option" tabindex="-1" data-value="zh" aria-selected="true">中文</li>
            </ul>
          </div>
          <div class="dropdown" id="theme-dropdown">
            <button type="button" class="dropdown-toggle" aria-haspopup="listbox" aria-expanded="false" aria-label="Theme"><span class="dropdown-value">跟随系统</span><svg class="chevron" width="10" height="10" viewBox="0 0 10 10" aria-hidden="true"><path d="M1 3l4 4 4-4" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
            <ul class="dropdown-menu" role="listbox" hidden>
              <li role="option" tabindex="-1" data-value="system" aria-selected="true">跟随系统</li>
              <li role="option" tabindex="-1" data-value="light" aria-selected="false">亮色</li>
              <li role="option" tabindex="-1" data-value="dark" aria-selected="false">暗色</li>
            </ul>
          </div>
          <button id="layout-toggle" title="Switch compact or sidebar layout" aria-label="Switch layout">
            <svg class="icon-sidebar" width="15" height="15" viewBox="0 0 16 16" aria-hidden="true"><rect x="1.75" y="2.75" width="12.5" height="10.5" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.3"/><rect x="1.75" y="2.75" width="4.5" height="10.5" rx="1.5" fill="currentColor"/></svg>
            <svg class="icon-compact" width="15" height="15" viewBox="0 0 16 16" aria-hidden="true"><rect x="1.75" y="2.75" width="12.5" height="10.5" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.3"/><rect x="1.75" y="2.75" width="12.5" height="3.5" rx="1.5" fill="currentColor"/></svg>
          </button
          ><button id="refresh">Refresh</button>
        </div>
      </header>
      <div id="notice" role="status" hidden></div>
      <div class="view-scroll"><div id="view" tabindex="-1"></div></div>
      <footer class="statusbar">
        <span id="status-summary">Reading local status</span
        ><span id="sync-summary">Sync status pending</span>
      </footer>
    </main>
    <div id="onboarding" hidden></div>
  </body>
</html>
