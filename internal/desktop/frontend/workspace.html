<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>Respire</title>
    <link rel="stylesheet" href="fonts.css" />
    <link rel="stylesheet" href="dashboard.css" />
    <link rel="stylesheet" href="memory/workspace.css" />
    <script type="module" src="client.js"></script>
  </head>
  <body>
    <a class="skip-link" href="#view">Skip to content</a>
    <aside class="sidebar">
      <div class="brand">
        <img id="brand-icon" src="brand/respire-light.svg" alt="" /><span
          >respire<span class="brand-period">.</span></span
        >
      </div>
      <div class="workspace-label">
        <span class="dot" id="connection-dot"></span>
        <div>
          <strong>Local workspace</strong>
          ><small id="connection-label">Connecting to Runtime</small>
        </div>
      </div>
      <nav aria-label="Main navigation">
        <button data-page="overview">Overview<span>01</span></button>
        <button data-page="memories">
          Memories<span id="nav-memory-count"></span>
        </button>
        <button data-page="diary">Diary<span>03</span></button>
        <button data-page="organize">Organize<span>04</span></button>
        <button data-page="models">Models & Index<span>05</span></button>
        <button data-page="accounts">Accounts & Spaces<span>06</span></button>
        <button data-page="injection">Install<span>07</span></button>
        <button data-page="grants">Access Grants<span>08</span></button>
      </nav>
      <nav class="nav-bottom" aria-label="Management">
        <button data-page="settings">Settings</button>
        <button data-page="updates">Updates</button>
        <button data-page="operations">Operations</button>
        <button data-page="diagnostics">Diagnostics</button>
      </nav>
      <div class="sidebar-foot">
        <span id="client-version"></span><small id="client-platform"></small>
      </div>
    </aside>
    <main>
      <header class="topbar">
        <div class="breadcrumbs">
          Workspace<span>/</span><strong id="breadcrumb">Overview</strong>
        </div>
        <div class="top-actions">
          <label class="sr-only" for="language">Language</label
          ><select id="language" aria-label="Language">
            <option value="en">English</option>
            <option value="zh">中文</option></select
          ><label class="sr-only" for="theme">Theme</label
          ><select id="theme" aria-label="Theme">
            <option value="system">System</option>
            <option value="light">Light</option>
            <option value="dark">Dark</option></select
          ><button id="layout-toggle" title="Switch compact or sidebar layout">
            Compact layout</button
          ><button id="refresh">Refresh</button>
        </div>
      </header>
      <div id="notice" role="status" hidden></div>
      <div class="view-scroll"><div id="view" tabindex="-1"></div></div>
      <footer class="statusbar">
        <span id="status-summary">Reading local status</span
        ><span id="sync-summary">Sync status pending</span>
      </footer>
    </main>
    <div id="first-language" class="first-language" hidden>
      <div class="first-language-card">
        <h1>Choose your language</h1>
        <p>You can change this later in Settings or from the top-right corner.</p>
        <div class="actions">
          <button class="primary" data-language="en">English</button>
          <button data-language="zh">中文</button>
        </div>
      </div>
    </div>
  </body>
</html>
