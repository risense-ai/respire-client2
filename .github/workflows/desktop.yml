name: Desktop client
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true
jobs:
  plan:
    name: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.pick.outputs.matrix }}
    steps:
      - id: pick
        env:
          REF_TYPE: ${{ github.ref_type }}
          EVENT: ${{ github.event_name }}
        run: |
          if [[ "$REF_TYPE" == 'tag' || "$EVENT" == 'workflow_dispatch' ]]; then
            echo 'matrix={"include":[{"os":"windows","arch":"amd64","runner":"windows-latest"},{"os":"windows","arch":"arm64","runner":"windows-11-arm"},{"os":"darwin","arch":"amd64","runner":"macos-15"},{"os":"darwin","arch":"arm64","runner":"macos-15"},{"os":"linux","arch":"amd64","runner":"ubuntu-22.04"},{"os":"linux","arch":"arm64","runner":"ubuntu-22.04-arm"}]}' >> "$GITHUB_OUTPUT"
          else
            echo 'matrix={"include":[{"os":"windows","arch":"amd64","runner":"windows-latest"},{"os":"linux","arch":"amd64","runner":"ubuntu-22.04"}]}' >> "$GITHUB_OUTPUT"
          fi
  lint:
    name: lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Linux build libraries
        run: sudo apt-get update -qq && sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libx11-dev fontconfig
      - name: Vet, frontend check, test
        run: |
          go vet -tags production,gtk3 ./...
          while IFS= read -r -d '' source; do node --check "$source"; done < <(find internal/desktop/frontend -name '*.js' -type f -print0)
          go test -tags production,gtk3 ./...
          node --check scripts/test-account-session-state.cjs
          node scripts/test-account-session-state.cjs
          node --check scripts/test-client-refresh.cjs
          node scripts/test-client-refresh.cjs
      - name: Bootstrap fetch fixture self-test
        run: bash scripts/test-fetch-macos-components.sh
  native:
    name: ${{ matrix.os }}-${{ matrix.arch }}
    needs: [plan]
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.plan.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Linux build libraries
        if: matrix.os == 'linux'
        run: sudo apt-get update -qq && sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libx11-dev fontconfig
      - name: Build Windows
        if: matrix.os == 'windows'
        shell: pwsh
        run: |
          $version = '0.2.56-dev.${{ github.run_number }}'
          if ('${{ github.ref_type }}' -eq 'tag') { $version = '${{ github.ref_name }}'.TrimStart('v') }
          ./scripts/build.ps1 -Version $version -Arch '${{ matrix.arch }}'
          $versionFile = Join-Path $env:RUNNER_TEMP 'respire-version.json'
          $process = Start-Process -FilePath "$PWD/dist/respire-windows-${{ matrix.arch }}.exe" -ArgumentList '--version' -RedirectStandardOutput $versionFile -WindowStyle Hidden -PassThru
          if (!$process.WaitForExit(10000)) { throw 'Executable startup timed out' }
          $process.WaitForExit()
          if ($process.ExitCode -ne 0) { throw 'Executable startup failed' }
          $info = Get-Content $versionFile -Raw | ConvertFrom-Json
          if ($info.version -ne $version -or $info.platform -ne 'windows-${{ matrix.arch }}') { throw 'Executable identity mismatch' }
          $fontsFile = Join-Path $env:RUNNER_TEMP 'respire-fonts.json'
          $fontProcess = Start-Process -FilePath "$PWD/dist/respire-windows-${{ matrix.arch }}.exe" -ArgumentList '--headless','fonts' -RedirectStandardOutput $fontsFile -WindowStyle Hidden -PassThru
          if (!$fontProcess.WaitForExit(15000)) { throw 'Font enumeration timed out' }
          $fontProcess.WaitForExit()
          if ($fontProcess.ExitCode -ne 0) { throw 'Font enumeration failed' }
          $fonts = Get-Content $fontsFile -Raw | ConvertFrom-Json
          if (!$fonts.ok -or $fonts.result.Count -eq 0) { throw 'No system fonts returned' }
      - name: Build installer
        if: matrix.os == 'windows'
        shell: pwsh
        env:
          # The fetch scripts read this for authenticated GitHub API calls;
          # runner gh is unauthenticated and shared egress IPs exhaust the
          # anonymous rate limit quickly.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = '0.2.56-dev.${{ github.run_number }}'
          if ('${{ github.ref_type }}' -eq 'tag') { $version = '${{ github.ref_name }}'.TrimStart('v') }
          # Channel follows the release convention: a plain v* tag is a stable
          # release and must bundle the stable Runtime; everything else (main
          # pushes, PRs, prerelease tags) rides the dev channel until a stable
          # Runtime release exists.
          $channel = 'dev'
          if (('${{ github.ref_type }}' -eq 'tag') -and ('${{ github.ref_name }}' -notmatch '-')) { $channel = 'stable' }
          choco install innosetup -y --no-progress
          ./scripts/build-installer.ps1 -Version $version -Arch '${{ matrix.arch }}' -Channel $channel
      - name: Install and uninstall Windows package
        if: matrix.os == 'windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $smokeRoot = [IO.Path]::GetFullPath((Join-Path $env:RUNNER_TEMP 'respire-installer-smoke'))
          $tempRoot = [IO.Path]::GetFullPath($env:RUNNER_TEMP).TrimEnd('\') + '\'
          if (!$smokeRoot.StartsWith($tempRoot, [StringComparison]::OrdinalIgnoreCase) -or (Test-Path -LiteralPath $smokeRoot)) { throw 'Unsafe or reused installer smoke directory' }
          $uninstallKeys = @('HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\{AFCA612B-7DD5-4380-8DD2-ADE8E2DA28C4}_is1', 'HKCU:\Software\WOW6432Node\Microsoft\Windows\CurrentVersion\Uninstall\{AFCA612B-7DD5-4380-8DD2-ADE8E2DA28C4}_is1')
          if ($uninstallKeys | Where-Object { Test-Path -LiteralPath $_ }) { throw 'Existing Respire installation on runner' }
          if (Test-Path -LiteralPath 'HKCU:\Software\Respire\Installer') { throw 'Existing Respire installer state on runner' }
          $webViewKey = 'SOFTWARE\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}'
          $webViewVersions = @('HKLM:\SOFTWARE\WOW6432Node\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}', "HKLM:\$webViewKey", "HKCU:\$webViewKey") | ForEach-Object { (Get-ItemProperty -LiteralPath $_ -Name pv -ErrorAction SilentlyContinue).pv }
          if (!($webViewVersions | Where-Object { $_ -and ([version]$_ -ge [version]'86.0.622.0') })) { throw 'Preinstalled WebView2 required for isolated installer check' }
          $appRoot = Join-Path $smokeRoot 'app'
          $env:RSRS_DATA_DIR = Join-Path $smokeRoot 'existing-data'
          New-Item -ItemType Directory -Path (Join-Path $env:RSRS_DATA_DIR 'client2') | Out-Null
          $preferences = Join-Path $env:RSRS_DATA_DIR 'client2\preferences.json'
          $dataSentinel = Join-Path $env:RSRS_DATA_DIR 'legacy-data.sentinel'
          [IO.File]::WriteAllText($preferences, '{"theme":"dark","language":"en"}')
          [IO.File]::WriteAllText($dataSentinel, 'preserve-existing-data')
          $preferencesHash = (Get-FileHash -LiteralPath $preferences -Algorithm SHA256).Hash
          $dataHash = (Get-FileHash -LiteralPath $dataSentinel -Algorithm SHA256).Hash
          $pathBefore = (Get-ItemProperty -LiteralPath 'HKCU:\Environment' -Name Path -ErrorAction SilentlyContinue).Path
          $setup = Join-Path $PWD 'dist\respire-windows-${{ matrix.arch }}-setup.exe'
          $install = Start-Process -FilePath $setup -ArgumentList @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/SP-', '/NOICONS', '/TASKS=""', ('/DIR="{0}"' -f $appRoot), ('/LOG="{0}"' -f (Join-Path $smokeRoot 'install.log'))) -WindowStyle Hidden -PassThru
          if (!$install.WaitForExit(120000)) { throw 'Installer smoke timed out' }
          $install.WaitForExit()
          if ($install.ExitCode -ne 0) { throw 'Installer smoke failed' }
          try {
            $version = '0.2.56-dev.${{ github.run_number }}'
            if ('${{ github.ref_type }}' -eq 'tag') { $version = '${{ github.ref_name }}'.TrimStart('v') }
            foreach ($check in @(@{ Name = 'version'; Args = @('--version') }, @{ Name = 'fonts'; Args = @('--headless', 'fonts') })) {
              $output = Join-Path $smokeRoot ($check.Name + '.json')
              $process = Start-Process -FilePath (Join-Path $appRoot 'Respire.exe') -ArgumentList $check.Args -RedirectStandardOutput $output -WindowStyle Hidden -PassThru
              if (!$process.WaitForExit(15000)) { throw 'Installed executable check timed out' }
              $process.WaitForExit()
              if ($process.ExitCode -ne 0) { throw 'Installed executable check failed' }
              $info = Get-Content -LiteralPath $output -Raw | ConvertFrom-Json
              if ($check.Name -eq 'version' -and ($info.version -ne $version -or $info.platform -ne 'windows-${{ matrix.arch }}')) { throw 'Installed executable identity mismatch' }
              if ($check.Name -eq 'fonts' -and (!$info.ok -or $info.result.Count -eq 0)) { throw 'Installed font enumeration failed' }
            }
          } finally {
            $uninstall = Start-Process -FilePath (Join-Path $appRoot 'unins000.exe') -ArgumentList @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART') -WindowStyle Hidden -PassThru
            if (!$uninstall.WaitForExit(60000)) { throw 'Uninstaller smoke timed out' }
            $uninstall.WaitForExit()
            if ($uninstall.ExitCode -ne 0) { throw 'Uninstaller smoke failed' }
          }
          if (Test-Path -LiteralPath (Join-Path $appRoot 'Respire.exe')) { throw 'Uninstall left the application executable' }
          if ($uninstallKeys | Where-Object { Test-Path -LiteralPath $_ }) { throw 'Uninstall left registration' }
          if ((Get-FileHash -LiteralPath $preferences -Algorithm SHA256).Hash -ne $preferencesHash -or (Get-FileHash -LiteralPath $dataSentinel -Algorithm SHA256).Hash -ne $dataHash) { throw 'Install/uninstall changed existing data' }
          if ((Get-ItemProperty -LiteralPath 'HKCU:\Environment' -Name Path -ErrorAction SilentlyContinue).Path -cne $pathBefore -or (Test-Path -LiteralPath 'HKCU:\Software\Respire\Installer')) { throw 'Install/uninstall changed user PATH state' }
      - name: Build Unix
        if: matrix.os != 'windows'
        shell: bash
        run: |
          version='0.2.56-dev.${{ github.run_number }}'
          if [[ '${{ github.ref_type }}' == tag ]]; then version='${{ github.ref_name }}'; version="${version#v}"; fi
          # Only the darwin/arm64 job fetches the bootstrap payload; stable
          # release tags lock to the stable channel, everything else verifies
          # against dev. An empty channel keeps plain zip-only behavior.
          channel=''
          if [[ '${{ matrix.os }}-${{ matrix.arch }}' == darwin-arm64 ]]; then
            if [[ '${{ github.ref_type }}' == tag && '${{ github.ref_name }}' != *-* ]]; then channel=stable; else channel=dev; fi
          fi
          RESPIRE_BOOTSTRAP_CHANNEL=$channel bash scripts/build.sh "$version" '${{ matrix.arch }}'
          ./dist/respire --version
          ./dist/respire --headless fonts > "$RUNNER_TEMP/respire-fonts.json"
          node -e 'const fs=require("fs");const r=JSON.parse(fs.readFileSync(process.argv[1],"utf8"));if(!r.ok||!Array.isArray(r.result)||!r.result.length)throw Error("No system fonts returned")' "$RUNNER_TEMP/respire-fonts.json"
          if [[ -n "$channel" ]]; then bash scripts/build-dmg.sh; fi
      - name: Check application copied from DMG
        if: matrix.os == 'darwin' && matrix.arch == 'arm64'
        shell: bash
        run: |
          set -euo pipefail
          smoke_root="$RUNNER_TEMP/respire-dmg-smoke"
          [[ ! -e "$smoke_root" ]] || { echo 'DMG smoke directory already exists' >&2; exit 1; }
          mkdir -p "$smoke_root/mount"
          hdiutil attach -readonly -nobrowse -mountpoint "$smoke_root/mount" dist/respire-darwin-arm64.dmg >/dev/null
          trap 'hdiutil detach "$smoke_root/mount" >/dev/null' EXIT
          ditto "$smoke_root/mount/Respire.app" "$smoke_root/Respire.app"
          version='0.2.56-dev.${{ github.run_number }}'
          if [[ '${{ github.ref_type }}' == tag ]]; then version='${{ github.ref_name }}'; version="${version#v}"; fi
          RSRS_DATA_DIR="$smoke_root/profile" "$smoke_root/Respire.app/Contents/MacOS/respire" --version > "$smoke_root/version.json"
          python3 - "$smoke_root/version.json" "$version" <<'PY'
          import json, sys
          info = json.load(open(sys.argv[1]))
          assert info['version'] == sys.argv[2] and info['platform'] == 'darwin-arm64', 'Copied DMG executable identity mismatch'
          PY
      - uses: actions/upload-artifact@v7
        with:
          name: respire-${{ matrix.os }}-${{ matrix.arch }}
          path: |
            dist/respire-${{ matrix.os }}-${{ matrix.arch }}.*
            dist/respire-${{ matrix.os }}-${{ matrix.arch }}-setup.exe
            dist/SHA256SUMS
            dist/LICENSE.txt
            dist/THIRD_PARTY_NOTICES.txt
          if-no-files-found: error
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [native]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v8
        with:
          pattern: respire-*
          path: artifacts
      - name: Assemble and verify release
        shell: bash
        run: |
          set -euo pipefail
          mkdir dist
          find artifacts -mindepth 2 -maxdepth 2 ! -path 'artifacts/respire-darwin-amd64/*' -name SHA256SUMS -exec cat {} + | sort > dist/SHA256SUMS
          find artifacts -mindepth 2 -maxdepth 2 ! -path 'artifacts/respire-darwin-amd64/*' -name 'respire-*' -type f -exec cp {} dist/ \;
          cp artifacts/respire-windows-amd64/LICENSE.txt dist/
          cp artifacts/respire-windows-amd64/THIRD_PARTY_NOTICES.txt dist/
          cd dist
          sha256sum --check SHA256SUMS
          # Five application update assets, two Windows installers and one DMG.
          test "$(wc -l < SHA256SUMS)" -eq 8
      - name: Generate release notes
        shell: bash
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: bash scripts/release-notes.sh "$GITHUB_REF_NAME" .release-notes.md
      - name: Generate update manifest
        shell: bash
        run: python3 scripts/update-manifest.py "$GITHUB_REF_NAME" dist .release-notes.md dist/client-updates.json 5
      - name: Publish tagged release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CURRENT_TAG: ${{ github.ref_name }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          args=(release create "$CURRENT_TAG" dist/* --repo "$REPOSITORY" --verify-tag --title "$CURRENT_TAG" --notes-file .release-notes.md)
          if [[ "$CURRENT_TAG" == *-* ]]; then args+=(--prerelease); fi
          gh "${args[@]}"
