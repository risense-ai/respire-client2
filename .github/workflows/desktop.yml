name: Desktop client
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    name: ${{ matrix.os }}-${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: windows, arch: amd64, runner: windows-latest}
          - {os: windows, arch: '386', runner: windows-latest}
          - {os: windows, arch: arm64, runner: windows-latest}
          - {os: darwin, arch: amd64, runner: macos-15-intel}
          - {os: darwin, arch: arm64, runner: macos-15}
          - {os: linux, arch: amd64, runner: ubuntu-24.04}
          - {os: linux, arch: arm64, runner: ubuntu-24.04-arm}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Linux build libraries
        if: matrix.os == 'linux'
        run: sudo apt-get update -qq && sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libx11-dev
      - name: Build Windows
        if: matrix.os == 'windows'
        shell: pwsh
        run: |
          $version = '0.1.0-dev.${{ github.run_number }}'
          if ('${{ github.ref_type }}' -eq 'tag') { $version = '${{ github.ref_name }}'.TrimStart('v') }
          ./scripts/build.ps1 -Version $version -Arch '${{ matrix.arch }}'
      - name: Build Unix
        if: matrix.os != 'windows'
        shell: bash
        run: |
          version='0.1.0-dev.${{ github.run_number }}'
          if [[ '${{ github.ref_type }}' == tag ]]; then version='${{ github.ref_name }}'; version="${version#v}"; fi
          bash scripts/build.sh "$version" '${{ matrix.arch }}'
          ./dist/respire --version
      - uses: actions/upload-artifact@v7
        with:
          name: respire-${{ matrix.os }}-${{ matrix.arch }}
          path: |
            dist/respire-${{ matrix.os }}-${{ matrix.arch }}.*
            dist/SHA256SUMS
            dist/LICENSE.txt
            dist/THIRD_PARTY_NOTICES.txt
          if-no-files-found: error
  linux-cross:
    name: linux-${{ matrix.arch }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - {arch: '386', image: 'debian:bookworm-slim'}
          - {arch: mipsle, image: 'debian:bookworm-slim'}
          - {arch: mips64le, image: 'debian:bookworm-slim'}
          - {arch: loong64, image: 'debian:forky-slim'}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      - name: Build with target GTK/WebKit sysroot
        shell: bash
        run: |
          version='0.1.0-dev.${{ github.run_number }}'
          if [[ '${{ github.ref_type }}' == tag ]]; then version='${{ github.ref_name }}'; version="${version#v}"; fi
          docker run --rm -v "$PWD:/src" -v "$(go env GOROOT):/opt/go:ro" -w /src \
            -e PATH=/opt/go/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin \
            '${{ matrix.image }}' bash scripts/build-linux-cross.sh "$version" '${{ matrix.arch }}'
      - uses: actions/upload-artifact@v7
        with:
          name: respire-linux-${{ matrix.arch }}
          path: |
            dist/respire-linux-${{ matrix.arch }}.tar.gz
            dist/SHA256SUMS
            dist/LICENSE.txt
            dist/THIRD_PARTY_NOTICES.txt
          if-no-files-found: error
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [native, linux-cross]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: respire-*
          path: artifacts
      - name: Assemble and verify release
        shell: bash
        run: |
          set -euo pipefail
          mkdir dist
          find artifacts -mindepth 2 -maxdepth 2 -name SHA256SUMS -exec cat {} + | sort > dist/SHA256SUMS
          find artifacts -mindepth 2 -maxdepth 2 -name 'respire-*' -type f -exec cp {} dist/ \;
          cp artifacts/respire-windows-amd64/LICENSE.txt dist/
          cp artifacts/respire-windows-amd64/THIRD_PARTY_NOTICES.txt dist/
          cd dist
          sha256sum --check SHA256SUMS
          test "$(wc -l < SHA256SUMS)" -eq 11
      - name: Publish tagged release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          args=(release create '${{ github.ref_name }}' dist/* --repo '${{ github.repository }}' --verify-tag --generate-notes)
          if [[ '${{ github.ref_name }}' == *-* ]]; then args+=(--prerelease); fi
          gh "${args[@]}"
