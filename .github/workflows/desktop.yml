name: Windows startup visibility diagnostic
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  visibility:
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
      - name: Compare verified desktop binaries in fresh profiles
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $env:RUNNER_TEMP 'desktop-visibility'
          [IO.Directory]::CreateDirectory($root) | Out-Null
          gh release download v2.0.0-dev.18 -R risense-ai/respire-client2 -p respire-windows-amd64.exe -O (Join-Path $root 'baseline.exe')
          if ($LASTEXITCODE -ne 0) { throw 'Could not download the reference release' }
          $archive = Join-Path $root 'candidate.zip'
          gh api repos/risense-ai/respire-client2/actions/artifacts/14514902052/zip > $archive
          if ($LASTEXITCODE -ne 0 -or (Get-FileHash -LiteralPath $archive).Hash -ine '7ab6a2a8bb245bb578dbeee27b7e73bc3934efa44ad138e4682b4c4388cea887') {
            throw 'Candidate archive unavailable or digest differs'
          }
          Expand-Archive -LiteralPath $archive -DestinationPath (Join-Path $root 'candidate')
          $candidate = @(Get-ChildItem -LiteralPath (Join-Path $root 'candidate') -Filter respire-windows-amd64.exe -Recurse)
          if ($candidate.Count -ne 1) { throw 'Expected one candidate executable' }
          $cases = @(
            @{Name='baseline'; Path=(Join-Path $root 'baseline.exe'); Hash='0f5d56a942f13ac193ba58e2dd2e76b9afa21d3ee3a448c9fc5a4409e9afb12b'}
            @{Name='candidate'; Path=$candidate[0].FullName; Hash='5bab78cca39b6ec9fb0cb5ed6a1623bbc7e31c6c9d20c040ae8ec10aabaccc00'}
          )
          $result = foreach ($case in $cases) {
            if ((Get-FileHash -LiteralPath $case.Path).Hash -ine $case.Hash) { throw 'Desktop executable digest differs' }
            $profile = Join-Path $root $case.Name
            foreach ($dir in @('home','appdata','local','temp','bin','client2')) {
              [IO.Directory]::CreateDirectory((Join-Path $profile $dir)) | Out-Null
            }
            '{"autoRuntime":false,"clientAutoUpdate":false,"runtimeAutoUpdate":false}' |
              Set-Content -LiteralPath (Join-Path $profile 'client2/preferences.json') -Encoding utf8NoBOM
            $listener = [Net.Sockets.TcpListener]::new([Net.IPAddress]::Loopback,0)
            $listener.Start()
            $port = $listener.LocalEndpoint.Port
            $listener.Stop()
            $start = [Diagnostics.ProcessStartInfo]::new($case.Path)
            $start.WorkingDirectory = $profile
            $start.UseShellExecute = $false
            $start.Environment.Clear()
            foreach ($name in @('SystemRoot','WINDIR','COMSPEC','PATHEXT','ProgramFiles','ProgramFiles(x86)','ProgramData')) {
              $value = [Environment]::GetEnvironmentVariable($name)
              if ($value) { $start.Environment[$name] = $value }
            }
            $start.Environment['PATH'] = "$($env:SystemRoot)\System32;$($env:SystemRoot)"
            foreach ($item in @{HOME='home';USERPROFILE='home';APPDATA='appdata';LOCALAPPDATA='local';TMP='temp';TEMP='temp';RSRS_BIN_DIR='bin'}.GetEnumerator()) {
              $start.Environment[$item.Key] = Join-Path $profile $item.Value
            }
            $start.Environment['RSRS_DATA_DIR'] = $profile
            $start.Environment['RSRS_RPC_PORT'] = [string]$port
            $start.Environment['RSRS_INSTANCE_ID'] = [guid]::NewGuid().ToString('N')
            $start.Environment['RSRS_CORE_TEST_MODE'] = '1'
            $start.Environment['RSRS_NO_AUTOSYNC'] = '1'
            $start.Environment['RSRS_UPDATE_CHECK'] = '0'
            $process = [Diagnostics.Process]::Start($start)
            $watch = [Diagnostics.Stopwatch]::StartNew()
            try {
              $visible = $false
              while ($watch.Elapsed.TotalSeconds -lt 20 -and !$process.HasExited) {
                $process.Refresh()
                if ($process.MainWindowHandle -ne [IntPtr]::Zero) { $visible = $true; break }
                Start-Sleep -Milliseconds 250
              }
              $webview = @(Get-CimInstance Win32_Process -Filter "ParentProcessId=$($process.Id)" |
                Where-Object Name -eq 'msedgewebview2.exe').Count
              $log = Join-Path $profile 'client2/client.log'
              if (Test-Path -LiteralPath $log) { Get-Content -LiteralPath $log -Tail 12 | Write-Host }
              [pscustomobject]@{build=$case.Name; visible=$visible; webview=$webview; elapsed_ms=$watch.ElapsedMilliseconds; exited=$process.HasExited}
            } finally {
              if (!$process.HasExited) { $process.Kill($true); $process.WaitForExit() }
              $process.Dispose()
            }
          }
          $result | ConvertTo-Json -Depth 3
          if (@($result | Where-Object { !$_.visible }).Count) { throw 'At least one desktop build did not show a window' }