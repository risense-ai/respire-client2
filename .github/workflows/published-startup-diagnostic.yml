name: Candidate native macOS proxy diagnostic
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  macos-proxy:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {runner: macos-15, arch: arm64}
          - {runner: macos-15-intel, arch: amd64}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: 343a7dca5c488f6c3186363fdb81dbfd76dc1e41
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/download-artifact@v8
        with:
          github-token: ${{ github.token }}
          run-id: 44358852551
          name: respire-darwin-${{ matrix.arch }}-1
          path: candidate
      - name: Check exact candidate and native proxy policy
        shell: bash
        env:
          TARGET: darwin-${{ matrix.arch }}
        run: |
          set -euo pipefail
          asset="respire-${TARGET}.zip"
          expected="$(awk -v file="$asset" '$2 == file {print $1}' candidate/SHA256SUMS)"
          actual="$(shasum -a 256 "candidate/$asset" | awk '{print $1}')"
          test "${#expected}" -eq 64
          test "$actual" = "$expected"
          ditto -x -k "candidate/$asset" unpack
          executable=unpack/Respire.app/Contents/MacOS/respire
          export RSRS_DATA_DIR="$RUNNER_TEMP/respire-proxy"
          unset http_proxy HTTP_PROXY https_proxy HTTPS_PROXY all_proxy ALL_PROXY no_proxy NO_PROXY
          "$executable" --version > version.json
          "$executable" --headless proxy > system.json
          export HTTPS_PROXY=http://127.0.0.1:12380
          "$executable" --headless proxy > environment.json
          printf '%s\n' '{"proxyMode":"direct"}' > "$RSRS_DATA_DIR/client2/preferences.json"
          "$executable" --headless proxy > direct.json
          python3 - <<'PY'
          import json, os
          def read(name):
              with open(name + ".json", encoding="utf-8") as stream:
                  data = json.load(stream)
              assert data["ok"], name
              return data["result"]
          with open("version.json", encoding="utf-8") as stream:
              version = json.load(stream)
          assert version["platform"] == os.environ["TARGET"] and version["version"] == "2.0.0-dev.18"
          system = read("system")
          assert system["mode"] == "system" and system["source"] in ("direct", "system")
          environment = read("environment")
          assert environment["source"] == "environment" and environment["https"] == os.environ["HTTPS_PROXY"]
          direct = read("direct")
          assert direct["mode"] == "direct" and direct["source"] == "off" and not direct.get("https")
          print("Native candidate proxy outcomes verified for " + os.environ["TARGET"])
          PY
          go test ./internal/host -run 'Proxy|Scutil' -count=1
