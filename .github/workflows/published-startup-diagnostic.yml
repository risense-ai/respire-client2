name: Sealed dev.18 native proxy diagnostic
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  native-proxy:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {runner: macos-15, target: darwin-arm64}
          - {runner: macos-15-intel, target: darwin-amd64}
          - {runner: windows-latest, target: windows-amd64}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    env:
      INPUT_RUN_ID: '44444713567'
      INPUT_ATTEMPT: '1'
      CANDIDATE_SOURCE: c763230b14d652658d3e4db4b434cc42105d1340
      CANDIDATE_VERSION: 2.0.0-dev.18
      TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: c763230b14d652658d3e4db4b434cc42105d1340
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Verify all six package receipts and the exact sealed artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python scripts/desktop-candidate.py producer --root sealed > sealed-input.json
          python -c 'import json; p=json.load(open("sealed-input.json")); assert p["artifact_id"]==14493445413 and p["artifact_zip_digest"]=="sha256:edc84bdc99f7da52e120dec6b23ae1d88c1cd9df4dd75aef48f23b674a911b98"'
      - name: Exercise native proxy selection with the sealed executable
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json, os, subprocess
          from pathlib import Path

          target = os.environ["TARGET"]
          windows = target.startswith("windows-")
          asset = Path("sealed") / f"respire-{target}{'.exe' if windows else '.zip'}"
          exe = asset
          if not windows:
              subprocess.run(["ditto", "-x", "-k", str(asset), "unpack"], check=True)
              exe = Path("unpack/Respire.app/Contents/MacOS/respire")
          profile = Path(os.environ["RUNNER_TEMP"]) / "respire-proxy"
          env = {key: value for key, value in os.environ.items()
                 if key.lower() not in ("http_proxy", "https_proxy", "all_proxy", "no_proxy")}
          env["RSRS_DATA_DIR"] = str(profile)

          def run(*args):
              return json.loads(subprocess.check_output([str(exe.resolve()), *args], env=env))

          def proxy():
              result = run("--headless", "proxy")
              assert result["ok"], result
              return result["result"]

          def outcomes():
              system = proxy()
              assert system["mode"] == "system"
              if windows:
                  assert system["source"] == "system" and system["https"] == "http://127.0.0.1:12381"
                  assert system["noProxy"] == "example.invalid"
              else:
                  assert system["source"] in ("direct", "system"), system
              env["HTTPS_PROXY"] = "http://127.0.0.1:12380"
              environment = proxy()
              assert environment["source"] == "environment" and environment["https"] == env["HTTPS_PROXY"]
              preferences = profile / "client2/preferences.json"
              preferences.write_text('{"proxyMode":"direct"}', encoding="utf-8")
              direct = proxy()
              assert direct["mode"] == "direct" and direct["source"] == "off" and not direct.get("https")
              preferences.unlink()
              del env["HTTPS_PROXY"]
              return {"system_source": system["source"], "environment_wins": True, "direct_override": True}

          version = run("--version")
          assert version["platform"] == target and version["version"] == os.environ["CANDIDATE_VERSION"]
          if windows:
              import winreg
              key_path = r"Software\Microsoft\Windows\CurrentVersion\Internet Settings"
              with winreg.OpenKey(winreg.HKEY_CURRENT_USER, key_path, 0, winreg.KEY_QUERY_VALUE | winreg.KEY_SET_VALUE) as key:
                  values = {"ProxyEnable": (1, winreg.REG_DWORD),
                            "ProxyServer": ("https=127.0.0.1:12381", winreg.REG_SZ),
                            "ProxyOverride": ("example.invalid", winreg.REG_SZ),
                            "AutoConfigURL": ("", winreg.REG_SZ)}
                  original = {}
                  for name in values:
                      try:
                          original[name] = winreg.QueryValueEx(key, name)
                      except FileNotFoundError:
                          original[name] = None
                  mutated = []
                  try:
                      for name, (value, kind) in values.items():
                          winreg.SetValueEx(key, name, 0, kind, value)
                          mutated.append(name)
                      result = outcomes()
                      winreg.SetValueEx(key, "AutoConfigURL", 0, winreg.REG_SZ, "http://127.0.0.1:12382/proxy.pac")
                      pac = proxy()
                      assert pac["source"] == "unavailable" and "PAC" in pac["note"], pac
                      result["pac_explicit"] = True
                  finally:
                      for name in reversed(mutated):
                          if original[name] is None:
                              winreg.DeleteValue(key, name)
                          else:
                              value, kind = original[name]
                              winreg.SetValueEx(key, name, 0, kind, value)
              result["registry_restored"] = True
          else:
              result = outcomes()
          with asset.open("rb") as stream:
              result["asset_sha256"] = hashlib.file_digest(stream, "sha256").hexdigest()
          result["version"] = version
          Path("proxy-result.json").write_text(json.dumps(result, indent=2), encoding="utf-8")
          print(json.dumps(result))
          PY
      - name: Run proxy policy tests from the exact source
        run: go test ./internal/host -run 'Proxy|Scutil|PAC' -count=1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sealed-proxy-${{ matrix.target }}
          path: |
            sealed-input.json
            proxy-result.json
          if-no-files-found: error
