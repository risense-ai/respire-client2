name: Windows client
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build and check
        shell: pwsh
        run: |
          $version = '0.1.0-dev.${{ github.run_number }}'
          if ('${{ github.ref_type }}' -eq 'tag') { $version = '${{ github.ref_name }}'.TrimStart('v') }
          ./scripts/build.ps1 -Version $version
      - uses: actions/upload-artifact@v4
        with:
          name: respire-windows-amd64
          path: dist/*
      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $releaseArgs = @('release','create','${{ github.ref_name }}','dist/respire-windows-amd64.exe','dist/SHA256SUMS','dist/LICENSE.txt','dist/THIRD_PARTY_NOTICES.txt','--verify-tag','--generate-notes')
          if ('${{ github.ref_name }}'.Contains('-')) { $releaseArgs += '--prerelease' }
          & gh @releaseArgs
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed' }
    permissions:
      contents: write
